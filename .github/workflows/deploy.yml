name: Deploy main via Cloudflare Builds

"on":
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  trigger-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare build for main
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          response=$(curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL")
          build_id=$(jq -er 'select(.success == true) | .result.build_uuid' <<< "$response")
          {
            echo "Cloudflare build queued: $build_id"
            echo
            echo "Cloudflare runs type checks, tests, and deployment against the latest main commit."
            echo "This workflow confirms submission, not deployment completion."
            echo "[View build status](https://dash.cloudflare.com/22bac35a7b729e9d10f97774753ba6b6/workers/services/view/depsmate/production/builds)"
          } >> "$GITHUB_STEP_SUMMARY"
